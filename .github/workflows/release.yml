name: Release

# Publishes a GitHub release for every pushed version tag, with or without a leading `v`
# (e.g. `0.4.3-lunii.9` or `v0.4.3-lunii.9`).
#
# The Maven version is taken from the tag (without the leading `v`), so the zip is always named
# `studio-web-ui-<version>-dist.zip` after the tag, even if the poms were not bumped.
# If a release for the tag already exists (e.g. created by hand), the zip is only attached to it
# when it has no `.zip` yet; an existing release is never otherwise modified.
#
# Lunii Pack's installers (Lunii Pack: installer_studio.ps1, installer_mac_linux.sh) read
# this repository's releases, pre-releases included, and take the FIRST `.zip` asset, then look for
# `studio-windows.bat` / `studio-linux.sh` / `studio-macos.sh` inside it. That is why exactly one
# `.zip` is attached, and why the archive layout produced by web-ui/src/main/assembly/dist.xml must
# keep those launchers.

on:
  push:
    tags: [ 'v[0-9]*', '[0-9]*' ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Derive the version from the tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not of the form X.Y.Z[-suffix] or vX.Y.Z[-suffix]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Only the CI checkout is changed; nothing is committed back.
      - name: Set the Maven version
        run: >
          mvn -B -q org.codehaus.mojo:versions-maven-plugin:2.16.2:set
          -DnewVersion=${{ steps.version.outputs.version }}
          -DgenerateBackupPoms=false -DprocessAllModules=true

      # Full build, frontend bundle and Java tests included: a release is never published from a
      # build whose tests failed.
      - name: Build with Maven
        run: mvn -B clean install

      - name: Locate the distribution
        id: dist
        shell: bash
        run: |
          shopt -s nullglob
          files=(web-ui/target/*-dist.zip)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one web-ui/target/*-dist.zip, found ${#files[@]}"
            exit 1
          fi
          zip="${files[0]}"
          # The installers need the launchers inside the archive.
          for launcher in studio-windows.bat studio-linux.sh studio-macos.sh; do
            unzip -l "$zip" | grep -q "/$launcher\$" || { echo "::error::$launcher missing from $zip"; exit 1; }
          done
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.dist.outputs.zip }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -q '\.zip$'; then
              echo "Release $GITHUB_REF_NAME already has a .zip: left untouched."
            else
              gh release upload "$GITHUB_REF_NAME" "$ZIP"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
