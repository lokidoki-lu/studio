name: Release

# Publishes a GitHub release for every pushed tag `v*` (e.g. `v0.4.3-lunii.1`).
#
# The Maven version is taken from the tag (without the leading `v`), so there is no pom to bump
# before tagging: the distribution is named `studio-web-ui-<version>-dist.zip` after the tag.
# A tag with a pre-release suffix (anything after a `-`) is published as a pre-release.
#
# Lunii Pack's installers (phsoulaneix/studio: installer_studio.ps1, installer_mac_linux.sh) read
# this repository's releases, pre-releases included, and take the FIRST `.zip` asset, then look for
# `studio-windows.bat` / `studio-linux.sh` / `studio-macos.sh` inside it. That is why exactly one
# `.zip` is attached, and why the archive layout produced by web-ui/src/main/assembly/dist.xml must
# keep those launchers.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Derive the version from the tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not of the form vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # Only the CI checkout is changed; nothing is committed back.
      - name: Set the Maven version
        run: >
          mvn -B -q org.codehaus.mojo:versions-maven-plugin:2.16.2:set
          -DnewVersion=${{ steps.version.outputs.version }}
          -DgenerateBackupPoms=false -DprocessAllModules=true

      # Full build, frontend bundle and Java tests included: a release is never published from a
      # build whose tests failed.
      - name: Build with Maven
        run: mvn -B clean install

      - name: Locate the distribution
        id: dist
        shell: bash
        run: |
          shopt -s nullglob
          files=(web-ui/target/*-dist.zip)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one web-ui/target/*-dist.zip, found ${#files[@]}"
            exit 1
          fi
          zip="${files[0]}"
          # The installers need the launchers inside the archive.
          for launcher in studio-windows.bat studio-linux.sh studio-macos.sh; do
            unzip -l "$zip" | grep -q "/$launcher\$" || { echo "::error::$launcher missing from $zip"; exit 1; }
          done
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=()
          [ "${{ steps.version.outputs.prerelease }}" = "true" ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${{ steps.dist.outputs.zip }}" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag "${flags[@]}"
